[tool.ruff]
target-version = "py310"
extend-exclude = ["ui", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = [
    # The codebase predates a formatter; long lines are pervasive and
    # mechanical rewrapping would bury every substantive diff.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# best_isolator.py is a deliberate backward-compat re-export shim: it star-
# imports the curated winapi surface (winapi defines __all__) so historical
# `from best_isolator import X` consumers keep working.
"best_isolator.py" = ["F401", "F403", "F405"]

[tool.mypy]
python_version = "3.10"
files = ["server", "isolator/config.py"]
# The engine package is untyped and Windows-only; check the server layer
# without following into isolator/ until annotations land there.
follow_imports = "silent"
ignore_missing_imports = true

[tool.coverage.run]
source = ["isolator", "server"]

[tool.coverage.report]
show_missing = false
skip_empty = true
